<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="title desc">
  <title id="title">Siddhar learning experience concept</title>
  <desc id="desc">A concept collage showing a Siddhar learning portal with a hero area, learner dashboard, quizzes, teacher tools, library, community and an achievement certificate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160d3a"/><stop offset=".55" stop-color="#35206f"/><stop offset="1" stop-color="#0f335d"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe08a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27ae60"/><stop offset="1" stop-color="#166534"/></linearGradient>
    <filter id="shine" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="933" rx="34" fill="#f4f6fb"/>
  <rect x="0" y="0" width="760" height="440" fill="url(#bg)"/>
  <circle cx="610" cy="105" r="85" fill="#ffd76a" opacity=".22" filter="url(#shine)"/>
  <path d="M0 360l120-95 88 54 110-132 110 125 105-84 227 170v42H0Z" fill="#0f274b" opacity=".72"/>
  <path d="M485 315q72-138 145 0" fill="none" stroke="#f8e4a2" stroke-width="8" opacity=".6"/>
  <circle cx="558" cy="188" r="34" fill="#f8e4a2" opacity=".9"/>
  <path d="M520 231q38-36 76 0l26 88h-128Z" fill="#f8e4a2" opacity=".86"/>
  <g font-family="Arial, sans-serif">
    <text x="42" y="55" fill="#fff" font-size="22" font-weight="700">✦  SIDDHAR LEARNING</text>
    <text x="42" y="140" fill="#ffe08a" font-size="45" font-weight="800">Ancient wisdom.</text>
    <text x="42" y="194" fill="#b7f0d1" font-size="45" font-weight="800">Modern learning.</text>
    <text x="42" y="248" fill="#bde7ff" font-size="45" font-weight="800">Limitless potential.</text>
    <text x="42" y="292" fill="#e4e8f5" font-size="17">Explore verified knowledge, practise with varied quizzes,</text>
    <text x="42" y="318" fill="#e4e8f5" font-size="17">and grow through a transparent mastery journey.</text>
    <rect x="42" y="346" width="178" height="52" rx="16" fill="url(#gold)"/><text x="74" y="379" fill="#2a174d" font-size="17" font-weight="700">START PREVIEW</text>
    <rect x="234" y="346" width="150" height="52" rx="16" fill="none" stroke="#c9d6ff"/><text x="267" y="379" fill="#fff" font-size="17" font-weight="700">EXPLORE</text>
  </g>
  <g transform="translate(770 0)" font-family="Arial, sans-serif">
    <rect width="630" height="440" fill="#f8fafc"/>
    <rect x="0" y="0" width="105" height="440" fill="#fff" stroke="#e2e8f0"/>
    <text x="18" y="42" fill="#3b1f7b" font-size="15" font-weight="700">OSB</text>
    <g fill="#64748b" font-size="12"><text x="18" y="94">Dashboard</text><text x="18" y="133">Learning</text><text x="18" y="172">Quizzes</text><text x="18" y="211">Teachers</text><text x="18" y="250">Library</text><text x="18" y="289">Community</text></g>
    <text x="135" y="45" fill="#152238" font-size="24" font-weight="700">Welcome back, learner</text>
    <text x="135" y="72" fill="#64748b" font-size="13">Keep learning and keep growing every day.</text>
    <g>
      <g transform="translate(135 92)"><rect width="140" height="76" rx="14" fill="#fff" stroke="#dbe3ef"/><text x="16" y="28" fill="#64748b" font-size="12">CURRENT STREAK</text><text x="16" y="58" fill="#f97316" font-size="24" font-weight="700">12 days</text></g>
      <g transform="translate(290 92)"><rect width="140" height="76" rx="14" fill="#fff" stroke="#dbe3ef"/><text x="16" y="28" fill="#64748b" font-size="12">XP POINTS</text><text x="16" y="58" fill="#6d28d9" font-size="24" font-weight="700">2,450</text></g>
      <g transform="translate(445 92)"><rect width="145" height="76" rx="14" fill="#fff" stroke="#dbe3ef"/><text x="16" y="28" fill="#64748b" font-size="12">QUIZZES</text><text x="16" y="58" fill="#0f766e" font-size="24" font-weight="700">56</text></g>
    </g>
    <g transform="translate(135 190)"><rect width="290" height="106" rx="16" fill="#fff" stroke="#dbe3ef"/><text x="18" y="28" fill="#152238" font-size="15" font-weight="700">CONTINUE LEARNING</text><rect x="18" y="47" width="245" height="12" rx="6" fill="#e2e8f0"/><rect x="18" y="47" width="165" height="12" rx="6" fill="#5b4ff0"/><text x="18" y="84" fill="#64748b" font-size="13">Siddhar wisdom basics — 65%</text></g>
    <g transform="translate(440 190)"><rect width="150" height="106" rx="16" fill="#fff" stroke="#dbe3ef"/><text x="18" y="28" fill="#152238" font-size="15" font-weight="700">DAILY QUIZ</text><circle cx="75" cy="63" r="24" fill="#ede9fe"/><text x="64" y="70" fill="#5b21b6" font-size="20">?</text></g>
    <g transform="translate(135 315)"><rect width="455" height="93" rx="16" fill="#fff" stroke="#dbe3ef"/><text x="18" y="28" fill="#152238" font-size="15" font-weight="700">THIS WEEK'S MASTERY</text><path d="M25 72l60-20 55 8 60-30 55 18 65-28 62 15" fill="none" stroke="#14b8a6" stroke-width="5"/><circle cx="382" cy="35" r="8" fill="#f59e0b"/></g>
  </g>
  <g font-family="Arial, sans-serif">
    <g transform="translate(18 465)"><rect width="380" height="228" rx="20" fill="#35206f"/><text x="24" y="38" fill="#fff" font-size="20" font-weight="700">DAILY QUIZ</text><text x="24" y="78" fill="#ddd6fe" font-size="15">Which statement best shows source integrity?</text><g fill="#fff" opacity=".12"><rect x="24" y="98" width="330" height="29" rx="8"/><rect x="24" y="136" width="330" height="29" rx="8"/><rect x="24" y="174" width="330" height="29" rx="8"/></g><text x="38" y="118" fill="#eee" font-size="12">A  Trust every confidence label</text><text x="38" y="156" fill="#b7f0d1" font-size="12">B  Link evidence and reviewer status</text><text x="38" y="194" fill="#eee" font-size="12">C  Remove unresolved sources</text></g>
    <g transform="translate(415 465)"><rect width="355" height="228" rx="20" fill="url(#green)"/><text x="24" y="40" fill="#fff" font-size="22" font-weight="700">Correct answer</text><text x="24" y="75" fill="#dcfce7" font-size="14">Evidence, provenance and reviewer status</text><text x="24" y="98" fill="#dcfce7" font-size="14">must remain visible before publication.</text><rect x="24" y="145" width="200" height="48" rx="14" fill="#fff"/><text x="57" y="176" fill="#166534" font-size="15" font-weight="700">NEXT QUESTION</text><circle cx="290" cy="150" r="45" fill="#f5c28b"/><path d="M250 190q40-68 80 0" fill="#d97706"/></g>
    <g transform="translate(787 465)"><rect width="270" height="228" rx="20" fill="#fff" stroke="#dbe3ef"/><text x="22" y="38" fill="#172033" font-size="19" font-weight="700">TEACHER HUB</text><g fill="#f8fafc" stroke="#dbe3ef"><rect x="22" y="58" width="104" height="60" rx="12"/><rect x="143" y="58" width="104" height="60" rx="12"/><rect x="22" y="133" width="104" height="60" rx="12"/><rect x="143" y="133" width="104" height="60" rx="12"/></g><text x="38" y="92" fill="#4f46e5" font-size="13">8 classes</text><text x="160" y="92" fill="#f59e0b" font-size="13">12 tasks</text><text x="38" y="167" fill="#0f766e" font-size="13">256 pupils</text><text x="160" y="167" fill="#2563eb" font-size="13">Reports</text></g>
    <g transform="translate(1075 465)"><rect width="307" height="228" rx="20" fill="#fffaf0" stroke="#e8c878" stroke-width="3"/><path d="M18 18h271v192H18Z" fill="none" stroke="#d4a72c"/><text x="153" y="58" text-anchor="middle" fill="#654719" font-size="21" font-weight="700">CERTIFICATE</text><text x="153" y="92" text-anchor="middle" fill="#7c5b2a" font-size="13">Achievement in verified learning</text><text x="153" y="132" text-anchor="middle" fill="#35206f" font-size="22" font-weight="700">Knowledge Explorer</text><circle cx="153" cy="174" r="25" fill="url(#gold)"/><text x="143" y="182" fill="#5b3b00" font-size="21">★</text></g>
  </g>
  <g transform="translate(18 715)" font-family="Arial, sans-serif">
    <rect width="1364" height="195" rx="22" fill="#fff" stroke="#dbe3ef"/>
    <text x="24" y="38" fill="#172033" font-size="20" font-weight="700">LIBRARY • WELLBEING • COMMUNITY • CHALLENGES</text>
    <g transform="translate(24 58)"><rect width="290" height="110" rx="15" fill="#f5f3ff"/><text x="20" y="34" fill="#5b21b6" font-size="17" font-weight="700">Verified library</text><text x="20" y="65" fill="#64748b" font-size="13">Source-aware texts, audio and lessons</text><text x="20" y="88" fill="#64748b" font-size="13">with review and rights status.</text></g>
    <g transform="translate(330 58)"><rect width="290" height="110" rx="15" fill="#ecfdf5"/><text x="20" y="34" fill="#047857" font-size="17" font-weight="700">Yoga and focus</text><text x="20" y="65" fill="#64748b" font-size="13">Breathing, mindful attention and</text><text x="20" y="88" fill="#64748b" font-size="13">healthy learning routines.</text></g>
    <g transform="translate(636 58)"><rect width="330" height="110" rx="15" fill="#eff6ff"/><text x="20" y="34" fill="#1d4ed8" font-size="17" font-weight="700">Community questions</text><text x="20" y="65" fill="#64748b" font-size="13">Moderated discussion with evidence links</text><text x="20" y="88" fill="#64748b" font-size="13">and age-appropriate participation.</text></g>
    <g transform="translate(982 58)"><rect width="350" height="110" rx="15" fill="#fff7ed"/><text x="20" y="34" fill="#c2410c" font-size="17" font-weight="700">Events and challenges</text><text x="20" y="65" fill="#64748b" font-size="13">Daily, weekly and classroom goals</text><text x="20" y="88" fill="#64748b" font-size="13">without manipulative reward design.</text></g>
  </g>
</svg>
