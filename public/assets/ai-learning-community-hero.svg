<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">AI-powered learning for every generation</title>
  <desc id="desc">A premium illustrated learning space where children, parents, teachers and an older learner collaborate around an AI dashboard, quizzes and progress cards.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b2f78"/>
      <stop offset="0.48" stop-color="#2459b8"/>
      <stop offset="1" stop-color="#7b4fd5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12386f" stop-opacity=".94"/>
      <stop offset="1" stop-color="#071c43" stop-opacity=".96"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
