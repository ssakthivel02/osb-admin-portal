name: Temporary Rights Import Fix

on:
  push:
    branches:
      - quality/siddhar-rights-provenance
    paths:
      - .github/workflows/temporary-rights-import-fix.yml

permissions:
  contents: write

jobs:
  fix-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: quality/siddhar-rights-provenance

      - name: Remove unused import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-siddhar-rights-provenance.mjs')
          content = path.read_text(encoding='utf-8')
          old = "import { basename, dirname, extname, isAbsolute, relative, resolve, sep } from 'node:path';"
          new = "import { dirname, extname, isAbsolute, relative, resolve, sep } from 'node:path';"
          if old not in content:
              raise SystemExit('Expected unused-import line was not found; refusing to modify the file.')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit focused correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-siddhar-rights-provenance.mjs
          git diff --cached --check
          git commit -m "fix(quality): remove unused rights validator import"
          git push origin HEAD:quality/siddhar-rights-provenance
