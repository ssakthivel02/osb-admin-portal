name: Quality Gate

on:
  pull_request:
    branches:
      - main
      - audit/repository-baseline
  push:
    branches:
      - audit/repository-baseline
      - quality/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        shell: bash
        run: |
          mkdir -p quality-evidence
          set -o pipefail
          npm run typecheck 2>&1 | tee quality-evidence/typecheck.log

      - name: Upload type-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typecheck-evidence
          path: quality-evidence/typecheck.log
          if-no-files-found: warn
          retention-days: 7

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osb-admin-portal-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
