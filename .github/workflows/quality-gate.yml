name: Quality Gate

on:
  pull_request:
    branches:
      - main
      - audit/repository-baseline
  push:
    branches:
      - audit/repository-baseline
      - quality/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify generated lockfile
        shell: bash
        run: test -s package-lock.json

      - name: Upload generated lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-candidate
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        run: npm run lint

      - name: Type-check
        shell: bash
        run: |
          mkdir -p quality-evidence
          set -o pipefail
          npm run typecheck 2>&1 | tee quality-evidence/typecheck.log

      - name: Upload type-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-evidence
          path: quality-evidence/typecheck.log
          if-no-files-found: warn
          retention-days: 7

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: osb-admin-portal-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
