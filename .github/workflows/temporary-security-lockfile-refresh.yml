name: Temporary Security Lockfile Refresh

on:
  push:
    branches:
      - quality/siddhar-editorial-disposition
    paths:
      - .github/workflows/temporary-security-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: quality/siddhar-editorial-disposition

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Refresh vulnerable development dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund \
            eslint@10.15.0 \
            typescript-eslint@8.73.0 \
            vite@8.3.8 \
            vitest@4.1.12
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit --audit-level=high

      - name: Commit dependency security refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git diff --cached --exit-code && { echo "No lockfile changes required"; exit 0; } || true
          git commit -m "fix(security): refresh vulnerable development dependencies"
          git push origin HEAD:quality/siddhar-editorial-disposition
